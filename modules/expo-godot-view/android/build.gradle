plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.godotview'
version = '0.1.0'

android {
  namespace "expo.modules.godotview"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    ndk {
      // The device (arm64) and the emulator (x86_64). Unlike iOS — whose 2020 engine has no
      // arm64-simulator slice — Godot's Android template ships x86_64, so the emulator can run
      // the full app. armeabi-v7a/x86 would double the APK for hardware we do not target.
      abiFilters 'arm64-v8a', 'x86_64'
    }
  }
  sourceSets {
    main {
      jniLibs.srcDirs += ['src/main/jniLibs']
    }
  }
  packagingOptions {
    // React Native and the Godot AAR both ship libc++_shared.so. vendor-engine.sh does not copy
    // Godot's, but keep the guard so a future re-vendor cannot break packaging.
    pickFirst 'lib/**/libc++_shared.so'
  }
  // Ship the keep rules with the library so any consumer's release build inherits them — the
  // engine's Java surface is reached only by JNI and reflection.
  defaultConfig {
    consumerProguardFiles 'proguard-rules.pro'
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Godot is a Fragment in this embed (see Godot.java), so the module's own Kotlin needs to see
  // the Fragment type, not just inherit it transitively.
  implementation 'androidx.fragment:fragment-ktx:1.8.5'
}
