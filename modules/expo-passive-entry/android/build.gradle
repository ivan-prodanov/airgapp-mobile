plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.passiveentry'
version = '0.1.0'

android {
  namespace "expo.modules.passiveentry"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // EncryptedSharedPreferences for the device key — see KeystoreKey.kt for why the
  // raw scalar cannot live in the Keystore itself.
  implementation 'androidx.security:security-crypto:1.1.0'
}
